<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The Times Letter edition.

  render_edition.py escapes every dynamic value and converts an optional
  story photo to a self-contained grayscale data URI before this template
  sees it. Keep this file free of JavaScript, remote assets and web fonts.

  The printed hierarchy is deliberate: the agenda first, full width; then
  the first news story at full width and two similarly sized stories beside
  each other, with the sports scores in a rail beside them. Weather is the
  masthead ear. Mail stays in the chat edition.
-->
<style>
  @page { size: Letter; margin: 9mm 10mm 10mm; background: #ffffff; }
  * { box-sizing: border-box; }
  :root { --paper: #ffffff; --ink: #151515; --ink-soft: #5b5b5b; --hairline: #c9c9c9; }
  html, body { background: var(--paper); }
  body {
    margin: 0; color: var(--ink);
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-size: 10px; line-height: 1.4;
  }

  .rule-top { border: 0; border-top: 1px solid var(--ink); margin: 0 0 4px; }
  .masthead-row { display: table; width: 100%; table-layout: fixed; }
  .ear { display: table-cell; width: 82px; vertical-align: middle; }
  .ear-right { text-align: right; }
  .masthead-cell { display: table-cell; vertical-align: middle; text-align: center; }
  .nameplate {
    margin: 0; font-family: "Big Caslon", Didot, "Bodoni MT", "Times New Roman", serif;
    font-size: 46px; font-weight: 900; line-height: .9; letter-spacing: .2px;
  }
  .nameplate-credit { margin: 1px 0 0; color: var(--ink-soft); font-size: 6px; font-style: italic; letter-spacing: .7px; }
  .ear-box { display: inline-block; min-width: 72px; border: 1px solid var(--ink); padding: 4px 6px; text-align: center; }
  .ear-weather { display: table; margin-left: auto; }
  .ear-weather .wx-icon-wrap, .ear-weather .ear-wx-temps { display: table-cell; vertical-align: middle; }
  .ear-weather .wx-icon-wrap { padding-right: 5px; }
  .ear-wx-high { font: 700 10px/1 Arial, sans-serif; }
  .ear-wx-low { margin-top: 2px; color: var(--ink-soft); font: 7px/1 Arial, sans-serif; }
  .ornament { display: table; width: 100%; margin: 3px 0 4px; }
  .orn-rule { display: table-cell; width: 49%; border-top: 1px solid var(--ink); }
  .orn-diamond { display: table-cell; margin: 0 6px; vertical-align: -3px; }
  .folio {
    display: table; width: 100%; table-layout: fixed;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    color: var(--ink-soft); font: 6.5px/1.2 Arial, sans-serif;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .folio span { display: table-cell; padding: 3px 1px; }
  .meta-left { text-align: left; }
  .meta-center { text-align: center; }
  .meta-right { text-align: right; }
  .rule-double {
    box-sizing: content-box; height: 1px; margin: 4px 0 7px;
    border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink);
  }

  .page-body { display: table; width: 100%; table-layout: fixed; }
  .news-column { display: table-cell; width: 76%; padding-right: 11px; vertical-align: top; }
  .page-body--full .news-column { display: block; width: auto; padding-right: 0; }
  .side-rail { display: table-cell; width: 24%; padding-left: 11px; border-left: 1px solid var(--ink); vertical-align: top; }
  .agenda { margin: 0 0 10px; }
  .agenda .cal-list { column-count: 2; column-gap: 16px; }
  .agenda .cal-item { break-inside: avoid; }
  .top-row { margin: 0 0 10px; padding: 0 0 10px; border-bottom: 2px solid var(--ink); }
  .section { margin: 0; padding: 0; }
  .section h2 {
    margin: 0 0 3px; font-family: "Big Caslon", Didot, "Bodoni MT", Georgia, serif;
    font-size: 18px; font-weight: 900; line-height: 1.05; break-after: avoid;
  }
  .kicker { margin: 0 0 3px; color: var(--ink-soft); font: 700 6px Arial, sans-serif; letter-spacing: 1.3px; text-transform: uppercase; }
  .headline { margin: 0 0 5px; color: var(--ink-soft); font-size: 9.5px; font-style: italic; line-height: 1.3; }
  .section p { margin: 0 0 6px; font-size: 10px; line-height: 1.42; text-align: justify; hyphens: auto; }
  .lead-cell h2 { font-size: 30px; line-height: 1; }
  .lead-cell .headline { font-size: 11px; }
  .lead-cell .dropcap {
    float: left; margin: .08em .08em 0 0;
    font-family: "Bodoni MT", Didot, Georgia, serif;
    font-size: 2.7em; font-weight: 900; line-height: .75;
  }
  .sources { margin-top: 4px !important; padding-top: 3px; border-top: 1px solid var(--hairline); color: var(--ink-soft); font: 6px/1.2 Arial, sans-serif !important; text-align: left !important; word-break: break-all; }
  .sources a { color: var(--ink-soft); }
  .unsourced { color: var(--ink-soft); font-size: 6.5px !important; font-style: italic; text-align: left !important; }
  .tag { margin-left: 4px; padding: 1px 3px; background: var(--ink); color: var(--paper); font: 6px Arial, sans-serif; white-space: nowrap; }

  .news-pair { display: table; width: 100%; table-layout: fixed; break-inside: avoid; page-break-inside: avoid; }
  .news-pair-cell { display: table-cell; width: 50%; vertical-align: top; }
  .news-pair-cell:first-child { padding-right: 8px; }
  .news-pair-cell + .news-pair-cell { padding-left: 8px; border-left: 1px solid var(--hairline); }
  .news-pair-cell h2 { font-size: 17px; }
  .news-pair-cell .section p { font-size: 9.5px; line-height: 1.4; }
  .story-photo { margin: 3px 0 5px; break-inside: avoid; page-break-inside: avoid; }
  .story-photo img { display: block; width: 100%; height: auto; border: 1px solid var(--hairline); }
  .story-photo figcaption { margin-top: 2px; color: var(--ink-soft); font-size: 6px; font-style: italic; }

  .section--calendar { break-inside: avoid; page-break-inside: avoid; }
  .section--calendar h2 {
    margin: 0; padding: 5px 6px; background: var(--ink); color: var(--paper);
    font: 700 8px Arial, sans-serif; letter-spacing: 1.2px;
    text-align: center; text-transform: uppercase;
  }
  .section--calendar .headline { margin: 6px 0; padding-bottom: 6px; border-bottom: 1px solid var(--hairline); font-size: 9px; }
  .cal-list { margin: 0; padding: 0; }
  .cal-item { display: table; width: 100%; padding: 7px 0; border-bottom: 1px solid var(--hairline); }
  .cal-icon-wrap, .cal-time, .cal-title { display: table-cell; vertical-align: top; }
  .cal-icon-wrap { width: 17px; padding-right: 3px; color: var(--ink-soft); }
  .cal-time { width: 35px; font: 700 8px Arial, sans-serif; }
  .cal-title { font: 8px/1.3 Arial, sans-serif; }
  .desk-icon { display: inline-block; margin-right: 4px; vertical-align: -2px; }
  .wx-icon, .cal-icon, .mail-icon { display: block; }

  .section--sports { break-inside: avoid; page-break-inside: avoid; }
  .section--sports h2 {
    margin: 0; padding: 5px 6px; background: var(--ink); color: var(--paper);
    font: 700 8px Arial, sans-serif; letter-spacing: 1.2px;
    text-align: center; text-transform: uppercase;
  }
  .sp-game { display: table; width: 100%; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
  .sp-teams, .sp-score { display: table-cell; vertical-align: top; font: 8px/1.3 Arial, sans-serif; }
  .sp-score { width: 34px; text-align: right; font-weight: 700; }
  .sp-away, .sp-home { display: block; }
  .sp-vs { font-size: 0; }

  .rule-double--footer { margin-top: 8px; margin-bottom: 3px; }
  footer { display: table; width: 100%; table-layout: fixed; color: var(--ink-soft); font: 6px Arial, sans-serif; letter-spacing: .8px; text-transform: uppercase; }
  footer span { display: table-cell; }
</style>
</head>
<body>
  <hr class="rule-top">
  <div class="masthead-row">
    <div class="ear ear-left"></div>
    <div class="masthead-cell">
      <h1 class="nameplate">{{MASTHEAD}}</h1>
      <p class="nameplate-credit">your personal newspaper</p>
    </div>
    <div class="ear ear-right">{{WEATHER_EAR}}</div>
  </div>
  <div class="ornament"><span class="orn-rule"></span><svg class="orn-diamond" viewBox="0 0 10 10" width="7" height="7" aria-hidden="true"><path d="M5 0 L10 5 L5 10 L0 5 Z" fill="currentColor"/></svg><span class="orn-rule"></span></div>
  <div class="folio">
    <span class="meta-left">Vol. 1 &mdash; No. 1</span>
    <span class="meta-center">{{LOCATION}}, {{DATE}}</span>
    <span class="meta-right">Single Copy</span>
  </div>
  <div class="rule-double"></div>

{{AGENDA}}

{{BODY}}

  <div class="rule-double rule-double--footer"></div>
  <footer>
    <span class="meta-left">Vol. 1 &mdash; No. 1</span>
    <span class="meta-center">{{DATE}}</span>
    <span class="meta-right">{{MASTHEAD}}</span>
  </footer>
</body>
</html>
